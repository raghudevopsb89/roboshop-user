name: User CI Pipeline
run-name: User CI Pipeline
on: [push, workflow_dispatch]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - run: echo "npx eslint ."

  build:
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: |
          ls -l
          pwd
          make docker-build

  test:
    needs: build
    runs-on: self-hosted
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

  publish:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: make docker-push

  dev-deploy:
    needs: publish
    runs-on: self-hosted
    steps:
      - name: Checkout helm repo
        uses: actions/checkout@v7
        with:
          repository: raghudevopsb89/roboshop-helm-v1
          path: helm
      - run: |
          cd helm
          make upgrade component_name=user github_sha=${GITHUB_SHA} cluster_env=dev

  qa-deploy:
    needs: publish
    runs-on: dev-deploy
    steps:
      - name: Checkout helm repo
        uses: actions/checkout@v7
        with:
          repository: raghudevopsb89/roboshop-helm-v1
          path: helm
      - run: |
          echo cd helm
          echo make upgrade component_name=user github_sha=${GITHUB_SHA} cluster_env=dev

  uat-deploy:
    needs: publish
    runs-on: qa-deploy
    steps:
      - name: Checkout helm repo
        uses: actions/checkout@v7
        with:
          repository: raghudevopsb89/roboshop-helm-v1
          path: helm
      - run: |
          echo cd helm
          echo make upgrade component_name=user github_sha=${GITHUB_SHA} cluster_env=dev

  prod-deploy:
    needs: publish
    runs-on: uat-deploy
    steps:
      - name: Checkout helm repo
        uses: actions/checkout@v7
        with:
          repository: raghudevopsb89/roboshop-helm-v1
          path: helm
      - run: |
          echo cd helm
          echo make upgrade component_name=user github_sha=${GITHUB_SHA} cluster_env=prod


